name: TaskStrips
options:
  bundleIdPrefix: com.saud.taskstrip
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  TaskStrips:
    type: application
    platform: macOS
    sources:
      - path: Sources/TaskStrips
        excludes:
          # Generator for the icon set, not something to ship inside the bundle.
          - "Assets.xcassets/make_icon.py"
          # Signed in, not copied in.
          - "TaskStrips.entitlements"
    # The one source of truth for the app's Info.plist, which XcodeGen writes from this on every
    # generate. It used to be checked in as well, and the two drifted in both directions at once:
    # CFBundleIconName was here but not in the file, so a build from the file had no Dock icon;
    # NSMicrophoneUsageDescription was in the file but not here, so a build after a generate
    # couldn't record. Whichever copy won, one feature was broken — and the file showing up as a
    # local modification after every generate was the same drift, wearing a different hat.
    info:
      path: Sources/TaskStrips/Info.plist
      properties:
        CFBundleName: Task Strips
        CFBundleDisplayName: Task Strips
        # The asset catalog compiles the artwork; this key is how the Dock finds it. Without it
        # you get the generic application icon and no error anywhere.
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "Task Strips records voice notes onto a strip. Nothing is recorded until you press Record, and the audio stays on this Mac."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud.taskstrip.mac
        PRODUCT_NAME: TaskStrips
        # The hardened runtime keeps the microphone shut unless the app is signed with this, and
        # the failure is silent: recording just produces nothing.
        CODE_SIGN_ENTITLEMENTS: Sources/TaskStrips/TaskStrips.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # @testable import TaskStrips in the test target needs this.
        Debug:
          ENABLE_TESTABILITY: true
  TaskStripsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TaskStripsTests
        excludes:
          # Generator for the fixture zip, not something to ship inside the test bundle.
          - "Fixtures/make_fixture.py"
    dependencies:
      - target: TaskStrips
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud.taskstrip.mac.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TaskStrips.app/Contents/MacOS/TaskStrips"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TaskStripsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/TaskStripsUITests
    dependencies:
      - target: TaskStrips
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud.taskstrip.mac.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TaskStrips
schemes:
  TaskStrips:
    build:
      targets:
        TaskStrips: all
        TaskStripsTests: [test]
        TaskStripsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TaskStripsTests
        - TaskStripsUITests
