name: TaskStrips
options:
  bundleIdPrefix: com.saud.taskstrip
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  TaskStrips:
    type: application
    platform: macOS
    sources:
      - path: Sources/TaskStrips
    info:
      path: Sources/TaskStrips/Info.plist
      properties:
        CFBundleName: Task Strips
        CFBundleDisplayName: Task Strips
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud.taskstrip.mac
        PRODUCT_NAME: TaskStrips
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # @testable import TaskStrips in the test target needs this.
        Debug:
          ENABLE_TESTABILITY: true
  TaskStripsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TaskStripsTests
        excludes:
          # Generator for the fixture zip, not something to ship inside the test bundle.
          - "Fixtures/make_fixture.py"
    dependencies:
      - target: TaskStrips
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud.taskstrip.mac.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TaskStrips.app/Contents/MacOS/TaskStrips"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TaskStripsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/TaskStripsUITests
    dependencies:
      - target: TaskStrips
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saud.taskstrip.mac.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TaskStrips
schemes:
  TaskStrips:
    build:
      targets:
        TaskStrips: all
        TaskStripsTests: [test]
        TaskStripsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TaskStripsTests
        - TaskStripsUITests
