name: macOS app

# The Mac port is developed from a Linux container with no Swift toolchain, so this is where the
# code first gets compiled at all. Android's Gradle build is untouched by it.
on:
  push:
    branches: ["claude/**"]
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
  workflow_dispatch:

jobs:
  build-and-test:
    # macos-14's Xcode is too old to open the project XcodeGen writes (object format 77).
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos/TaskStrips

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      # Logged because the first CI run died on exactly this pairing: a project format the
      # runner's Xcode couldn't read.
      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate the Xcode project
        run: xcodegen generate

      # Ad-hoc signing rather than none: the UI tests have to actually launch the app.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TaskStrips.xcodeproj \
            -scheme TaskStrips \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            | xcbeautify

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project TaskStrips.xcodeproj \
            -scheme TaskStrips \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:TaskStripsTests \
            | xcbeautify

      # No longer advisory: the runner grants Accessibility fine, the suite is green, and the one
      # known SwiftUI limitation is recorded as an XCTExpectFailure rather than hidden here. A red
      # UI step now means a real regression.
      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project TaskStrips.xcodeproj \
            -scheme TaskStrips \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:TaskStripsUITests \
            -resultBundlePath UITestResults.xcresult \
            | xcbeautify

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: macos/TaskStrips/UITestResults.xcresult
          if-no-files-found: ignore
